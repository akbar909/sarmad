<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - DeepGuard</title>
    <link rel="stylesheet" href="css/style.css?v=1785129584">
    <style>
        .auth-container { display: flex; min-height: 100vh; }
        .auth-left {
            flex: 1; background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            display: flex; flex-direction: column; justify-content: center;
            padding: 4rem; position: relative; overflow: hidden; color: #fff;
        }
        .auth-left::before {
            content: ''; position: absolute; top: -20%; left: -20%;
            width: 60%; height: 60%; background: var(--primary);
            filter: blur(100px); opacity: 0.3; border-radius: 50%;
        }
        .auth-left::after {
            content: ''; position: absolute; bottom: -20%; right: -20%;
            width: 60%; height: 60%; background: var(--accent);
            filter: blur(100px); opacity: 0.3; border-radius: 50%;
        }
        .auth-logo {
            display: flex; align-items: center; gap: 0.5rem; font-size: 1.5rem;
            font-weight: 800; margin-bottom: 2rem; position: relative; z-index: 1;
        }
        .auth-left h1 { font-size: 3rem; margin-bottom: 1.5rem; position: relative; z-index: 1; }
        .auth-right {
            flex: 1; display: flex; align-items: center; justify-content: center;
            background: var(--bg-dark); padding: 2rem;
        }
        .auth-card {
            width: 100%; max-width: 450px; padding: 3rem; background: var(--bg-card);
            border: 1px solid var(--border-color); border-radius: 24px;
            backdrop-filter: blur(20px); box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }
        .auth-card h2 { margin-bottom: 0.5rem; }
        .auth-card p { color: var(--text-secondary); margin-bottom: 2rem; }
        .auth-link { color: var(--primary); font-weight: 500; text-decoration: none; }
        .auth-link:hover { color: var(--primary-hover); text-decoration: underline; }
        
        #resetStep { display: none; }
        @media (max-width: 900px) {
            .auth-container { flex-direction: column; }
            .auth-left { padding: 2rem; min-height: 40vh; }
            .auth-right { padding: 2rem 1rem; }
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <!-- Left Side -->
        <div class="auth-left">
            <div class="auth-logo animate">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                DeepGuard
            </div>
            <h1 class="animate" data-delay="100">Secure Account Recovery</h1>
            <p class="animate" data-delay="200" style="color: rgba(255,255,255,0.7); max-width: 400px; font-size: 1.1rem;">Get back to verifying products securely and instantly.</p>
        </div>

        <!-- Right Side -->
        <div class="auth-right">
            <div class="auth-card animate" data-delay="100">
                
                <!-- STEP 1: Request OTP -->
                <div id="requestStep">
                    <h2>Forgot Password</h2>
                    <p>Enter your email to receive a One-Time Password.</p>
                    <form id="forgotForm">
                        <div class="form-group">
                            <label class="form-label" for="email">Email address</label>
                            <input type="email" id="email" class="form-input" placeholder="Enter your email" required>
                        </div>
                        <button type="submit" id="sendOtpBtn" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
                            Send OTP
                        </button>
                    </form>
                </div>

                <!-- STEP 2: Reset Password -->
                <div id="resetStep">
                    <h2>Reset Password</h2>
                    <p>Enter the OTP sent to your email and your new password.</p>
                    <form id="resetForm">
                        <div class="form-group">
                            <label class="form-label" for="otp">OTP Code</label>
                            <input type="text" id="otp" class="form-input" placeholder="123456" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="new_password">New Password</label>
                            <div style="position:relative">
                                <input type="password" id="new_password" class="form-input" placeholder="••••••••" required>
                                <span onclick="togglePassword('new_password')" 
                                    style="position:absolute; right:12px; top:50%; transform:translateY(-50%); cursor:pointer; font-size:18px;"
                                    id="eyeIcon">👁️</span>
                            </div>
                        </div>
                        <button type="submit" id="resetBtn" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
                            Reset Password
                        </button>
                    </form>
                </div>

                <p style="text-align: center; margin-top: 2rem; color: var(--text-secondary); font-size: 0.95rem;">
                    Remembered your password? 
                    <a href="login.html" class="auth-link">Log in</a>
                </p>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/animations.js?v=1785129584"></script>
    
    <script>
        // Dynamic API base — works locally AND on Netlify/production
        const API_BASE_URL = (
            window.location.hostname === 'localhost' ||
            window.location.hostname === '127.0.0.1'
        ) ? 'http://127.0.0.1:8000/api' : 'https://YOUR_BACKEND_URL_HERE/api';

        let storedEmail = '';

        // ===== STEP 1: Send OTP =====
        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            if (!email) return;

            const btn = document.getElementById('sendOtpBtn');
            btn.textContent = 'Sending...';
            btn.disabled = true;

            try {
                const res = await fetch(`${API_BASE_URL}/auth/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email })
                });

                const data = await res.json();

                if (res.ok) {
                    storedEmail = email;
                    localStorage.setItem('resetEmail', email);

                    // Hide Step 1, show Step 2
                    document.getElementById('requestStep').style.display = 'none';
                    document.getElementById('resetStep').style.display = 'block';

                    Swal.fire({
                        icon: 'success',
                        title: 'OTP Sent!',
                        text: data.message || 'Check your email or server terminal for the OTP code.',
                        background: '#1e293b',
                        color: '#fff',
                        confirmButtonColor: '#6C63FF'
                    });
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'Error',
                        text: data.detail || 'Failed to send OTP.',
                        background: '#1e293b',
                        color: '#fff'
                    });
                }
            } catch (err) {
                Swal.fire({
                    icon: 'error',
                    title: 'Connection Error',
                    text: 'Could not reach server. Make sure backend is running.',
                    background: '#1e293b',
                    color: '#fff'
                });
            } finally {
                btn.textContent = 'Send OTP';
                btn.disabled = false;
            }
        });

        // ===== STEP 2: Reset Password =====
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = storedEmail || localStorage.getItem('resetEmail');
            const otp_code = document.getElementById('otp').value.trim();
            const new_password = document.getElementById('new_password').value;

            if (!email) {
                Swal.fire({ icon: 'warning', title: 'Session expired', text: 'Please go back and request a new OTP.', background: '#1e293b', color: '#fff' });
                return;
            }

            const btn = document.getElementById('resetBtn');
            btn.textContent = 'Resetting...';
            btn.disabled = true;

            try {
                const res = await fetch(`${API_BASE_URL}/auth/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, otp_code: otp_code, new_password: new_password })
                });

                const data = await res.json();

                if (res.ok) {
                    localStorage.removeItem('resetEmail');
                    await Swal.fire({
                        icon: 'success',
                        title: 'Password Reset!',
                        text: data.message || 'You can now login with your new password.',
                        background: '#1e293b',
                        color: '#fff',
                        confirmButtonColor: '#6C63FF'
                    });
                    window.location.href = 'login.html';
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'Failed',
                        text: data.detail || 'Invalid OTP or request expired.',
                        background: '#1e293b',
                        color: '#fff'
                    });
                }
            } catch (err) {
                Swal.fire({ icon: 'error', title: 'Connection Error', text: 'Could not reach server.', background: '#1e293b', color: '#fff' });
            } finally {
                btn.textContent = 'Reset Password';
                btn.disabled = false;
            }
        });

        function togglePassword(fieldId) {
            const field = document.getElementById(fieldId);
            const icon = document.getElementById('eyeIcon');
            if (field.type === 'password') {
                field.type = 'text';
                icon.textContent = '🙈';
            } else {
                field.type = 'password';
                icon.textContent = '👁️';
            }
        }
    </script>
</body>
</html>
